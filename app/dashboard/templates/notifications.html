<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Notifications</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; vertical-align: top; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
  <p><a href="/">Dashboard</a></p>
  <h1>Dashboard Notifications</h1>
  <p><a href="/notifications?unread_only=true">Only unread</a> | <a href="/notifications">All</a></p>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Event</th>
        <th>Title</th>
        <th>Message</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for n in rows %}
      <tr>
        <td>{{ n.created_at }}</td>
        <td>{{ n.event_type }}</td>
        <td>{{ n.title }}</td>
        <td>{{ n.message }}</td>
        <td>{{ n.status }}</td>
        <td>
          {% if n.status == 'unread' %}
          <form method="post" action="/notifications/{{ n.id }}/read"><button type="submit">Mark read</button></form>
          {% else %}
          -
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
