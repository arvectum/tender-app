<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .box { max-width: 380px; border: 1px solid #ddd; padding: 16px; border-radius: 8px; }
    .row { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    input, button { padding: 8px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Tender Calculator Login</h1>
  <div class="box">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="row">
        <label>Username</label>
        <input name="username" required />
      </div>
      <div class="row">
        <label>Password</label>
        <input name="password" type="password" required />
      </div>
      <div class="row">
        <button type="submit">Sign in</button>
      </div>
    </form>
  </div>
</body>
</html>
