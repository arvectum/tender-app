[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-small-volume-calculator"
version = "0.7.0"
description = "MVP calculator for small-volume tenders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.0",
  "typer>=0.12.0",
  "jinja2>=3.1.0",
  "openpyxl>=3.1.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10.4",
  "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
browser = [
  "playwright>=1.54.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dashboard/templates/*.html"]
