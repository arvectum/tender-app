version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tender_small_volume
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dashboard:
    build: .
    command: python -m app.cli run-dashboard
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/tender_small_volume
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  scheduler:
    build: .
    command: python -m app.cli run-scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/tender_small_volume
    depends_on:
      - postgres

volumes:
  pgdata:
